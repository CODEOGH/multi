<!DOCTYPE html>

<meta charset="utf-8">
<title>PS4 7.00---13.52 fw GoldHen By OGH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);

function DLProgress(e){
    Percent=(Math.round(e.loaded / e.total * 100));
    window.msgs.innerHTML="INSTALLING OFFLINE CACHE: " + Percent + "%";
}

function DisplayCacheProgress(){
    window.msgs.innerHTML="CACHE INSTALLED SUCCESSFULLY ✔";
    setTimeout(function(){
        window.msgs.innerHTML="LAUNCHING GOLDHEN... PLEASE WAIT";
        setTimeout(function(){
            window.location.reload();
        }, 1000);
    }, 1500);
}

window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="ERROR INSTALLING CACHE! - CLEAR AND RE-OPEN YOUR BROWSER ...";};
</script>

<div id="main-container">
    <div>
        <h1>PS4 7.00---13.52 FW<br>GOLDHEN BY OGH</h1>
        <hr>
    </div>
    
    <h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">STARTING CACHE INSTALLATION...</h1>

    <div id="qr-container">

    <div class="thanks-container">
