<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 7.00---13.52 fw GoldHen By OGH</title>
<!-- Lien unique vers le fichier CSS localisé à la racine -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;

// EXTRACTION STRICTE : match[1] extrait uniquement le numéro de version (ex: 13.52)
var fwVersion = isPS4 ? match[1] : "Unknown"; 
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    document.getElementById("msgs").innerHTML = "CONTENT NOT FOUND! - CLEAR BROWSER DATA & RE-INSTALL CACHE...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("msgs").innerHTML = "ONLY FOR PS4 WITH FIRMWARE 7.00 TO 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("msgs").innerHTML = 'UNSUPPORTED FIRMWARE: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=10";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

<div id="status-success" class="full-screen-status"></div>
<div id="status-failed" class="full-screen-status"></div>

<div id="main-container">
    <div>
        <h1>PS4 7.00---13.52 FW GOLDHEN BY OGH</h1>
        <hr>
    </div>
    
    <h1 id="msgs" style="font-size: 30px; margin-top: 77px; margin-bottom: 455px;">LOADING GOLDHEN V2.4B18.12... PLEASE WAIT</h1>

    <!-- Bloc QR Code épuré -->
    <div id="qr-container">
        <div class="qr-box">
            <div class="qr-image"></div>
            <p>THANKS FOR YOUR SUPPORT ❤️</p>
        </div>
    </div>

    <div class="thanks-container">
        <h1 class="thanks" style="margin: 0;">SPECIAL THANKS TO: <span style="color: #ff6600;">SISTRo</span></h1>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var targetNode = document.getElementById('msgs');
    if (!targetNode) return;

    var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            var text = targetNode.innerText.toUpperCase();
            if (text.includes("SUCCESS") || text.includes("DONE") || text.includes("LAUNCHED") || text.includes("LOADED")) {
                document.getElementById("main-container").style.display = "none";
                document.getElementById("status-success").style.display = "block";
                observer.disconnect();
            }
            else if (text.includes("FAILED") || text.includes("ERROR") || text.includes("NOT FOUND")) {
                document.getElementById("main-container").style.display = "none";
                document.getElementById("status-failed").style.display = "block";
                observer.disconnect();
            }
        });
    });
    observer.observe(targetNode, { characterData: true, childList: true, subtree: true });
});
</script>
</body>
</html>
